<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House - Главная страница</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="mask-icon" href="favicon/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="../fonts/inter-regular.woff2" as="font" crossorigin="anonymous">
  <link rel="preload" href="../fonts/inter-semibold.woff2" as="font" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">

<body>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <a class="header__logo" href="index.html">
          <img src="../img/svg/logo.svg" width="100" height="60" alt="Coffee House logo.">
        </a>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a class="header__nav-link" href="#favorite-coffee">Favorite coffee</a>
            </li>
            <li class="header__nav-item">
              <a class="header__nav-link" href="#about">About</a>
            </li>
            <li class="header__nav-item">
              <a class="header__nav-link" href="#mobile-app">Mobile app</a>
            </li>
            <li class="header__nav-item">
              <a class="header__nav-link" href="#contact-us">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__right">
          <div class="header__theme-wrapper">
            <span class="header__theme header__theme--light" aria-label="Switch to light theme.">
              <img src="../img/svg/icon-theme-light.svg" width="22" height="22" alt="">
            </span>
            <span class="header__theme header__theme--light" aria-label="Switch to dark theme.">
              <img src="../img/svg/icon-theme-dark.svg" width="18" height="18" alt="">
            </span>
          </div>
          <a class="header__menu-link" href="catalog.html">Menu</a>
        </div>
      </div>
    </div>
  </header>
  <main>

  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer__wrapper">
        <div class="footer__intro">
          <h2>Sip, Savor, Smile. <span>It&rsquo;s coffee time!</span></h2>
          <div class="footer__social social">
            <ul class="social__list">
              <li class="social__item">
                <a class="social__link" href="#" aria-label="Coffee Shop on Twitter." target="_blank">
                  <img src="../img/svg/icon-twitter.svg" width="24" height="24" alt="">
                </a>
              </li>
              <li class="social__item">
                <a class="social__link" href="#" aria-label="Coffee Shop in Instagram." target="_blank">
                  <img src="../img/svg/icon-instagram.svg" width="24" height="24" alt="">
                </a>
              </li>
              <li class="social__item">
                <a class="social__link" href="#" aria-label="Coffee Shop in Facebook." target="_blank">
                  <img src="../img/svg/icon-facebook.svg" width="24" height="24" alt="">
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="footer__contacts">
          <h3>Contact us</h3>
          <ul class="footer__contacts-list">
            <li class="footer__contacts-item">
              <img src="../img/svg/icon-pin.svg" width="20" height="20" alt="">
              <address class="footer__address">8558 Green Rd.,&nbsp;&nbsp;LA</address>
            </li>
            <li class="footer__contacts-item">
              <img src="../img/svg/icon-phone.svg" width="20" height="20" alt="">
              <a class="footer__tel" href="tel:+16035550123" aria-label="Call in Coffee Shop.">+1 (603) 555-0123</a>
            </li>
            <li class="footer__contacts-item">
              <img src="../img/svg/icon-clock.svg" width="20" height="20" alt="">
              <span>Mon-Sat: 9:00&nbsp;AM&nbsp;– 23:00&nbsp;PM</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </footer>
</body>

</html>
